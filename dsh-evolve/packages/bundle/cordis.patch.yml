- insert:
    - id: dsh-evolve
      name: cordis:group
      group: true
      config:
        - id: evolve-core
          name: '@dsh-evolve/bundle/host/core'
          config:
            enabled: true
            autonomy: ask-promote
            sessionAdoption: auto
        - id: evolve-observer
          name: '@dsh-evolve/bundle/host/observer'
        - id: evolve-probe
          name: '@dsh-evolve/bundle/host/probe'
          config:
            enabled: true
            k: 1
        - id: evolve-sandbox
          name: '@dsh-evolve/bundle/host/sandbox'
        - id: evolve-agent
          name: '@dsh-evolve/bundle/host/agent'
          config:
            enabled: true
            proposer: llm
            automaticLifecycle: true
            worker: true
            repeatFailureThreshold: 3
            maxProposalTokens: 1000000
            probeMaxOutputTokens: 1000000
            postTaskMaxProcessingTokens: 512000000
            postTaskMaxWallMs: 28800000
            postTaskStrategyVariants: 2
            postTaskMaxDepth: 3
        - id: evolve-tools
          name: '@dsh-evolve/bundle/host/tools'
        - id: evolve-commands
          name: '@dsh-evolve/bundle/host/commands'
        - id: evolve-ui
          name: '@dsh-evolve/bundle'
    - id: evolve-loop
      name: '@dsh-evolve/bundle/host/loop'
      disabled: true
      config:
        agents: []
